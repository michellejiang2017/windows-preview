services:
  - type: web
    name: passage-document-qa
    runtime: python
    plan: free
    buildCommand: pip install -r rag/requirements.txt && python -m rag.app.bootstrap
    startCommand: uvicorn rag.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HF_HUB_DISABLE_TELEMETRY
        value: '1'
      - key: OTEL_SDK_DISABLED
        value: 'true'
