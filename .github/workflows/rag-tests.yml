name: RAG tests
on:
  push:
    paths: ['rag/**', 'desktop/engine.py', 'render.yaml', '.github/workflows/rag-tests.yml']
  pull_request:
    paths: ['rag/**', 'desktop/engine.py', 'render.yaml', '.github/workflows/rag-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag/requirements.txt
      - run: pip install -r rag/requirements.txt
      - run: python -m pytest rag/tests -q
