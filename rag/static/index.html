<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Passage</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="app-bar">
    <strong class="brand">Passage</strong>
    <button id="toggle-sources" class="mobile-only" aria-expanded="false" aria-controls="sources">Documents</button>
    <span id="connection" role="status">Starting…</span>
  </header>
  <main>
    <aside id="sources" aria-label="Documents">
      <div class="sidebar-heading"><h2>Documents</h2><span id="doc-count"></span></div>
      <div id="drop" class="drop">
        <button id="upload" class="upload-button" disabled>+ Upload document</button>
        <input id="file" class="sr-only" type="file" accept=".pdf,.txt,.csv" aria-label="Upload document" disabled>
        <small>PDF, text or CSV · up to 5 MB</small>
      </div>
      <div id="docs" aria-label="Document list"></div>
      <p class="privacy">Uploads are temporary.</p>
    </aside>
    <section class="workspace" aria-label="Document questions">
      <div class="search-scope">
        <label for="filter">Search in</label>
        <select id="filter" disabled><option value="">All documents</option></select>
      </div>
      <div class="question-area">
        <h1>Ask your documents</h1>
        <form id="question-form">
          <label for="question" class="sr-only">Your question</label>
          <textarea id="question" maxlength="500" rows="3" placeholder="Ask a question…" disabled></textarea>
          <div class="composer-footer"><span class="keyboard-hint">Ctrl + Enter to ask</span><button id="ask" class="primary" disabled>Ask</button></div>
        </form>
        <div id="examples" class="examples" aria-label="Sample questions">
          <button data-example="python" disabled>Who wrote the Zen of Python?</button>
          <button data-example="pdf" disabled>Which PDF page is blank?</button>
          <button data-example="csv" disabled>What species is in row 1?</button>
        </div>
        <div class="status-row"><p id="status" role="status" aria-live="polite">Connecting…</p><button id="retry" hidden>Retry</button></div>
        <div id="result" aria-live="polite"></div>
      </div>
    </section>
  </main>
</body>
</html>
